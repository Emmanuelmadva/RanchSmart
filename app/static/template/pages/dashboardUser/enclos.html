<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enclos | RanchSmart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8B4513',
            accent: '#DAA520',
            dark: '#2F1B12',
            success: '#10B981',
            warning: '#F59E0B',
            danger: '#EF4444',
            muted: '#6B7280',
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.4s ease-out',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
          },
        }
      }
    };
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #DAA520; border-radius: 3px; }
  </style>
</head>

<body class="bg-gradient-to-br from-amber-50 to-orange-50 font-sans antialiased">

  <!-- === SIDEBAR === -->
  <aside class="fixed inset-y-0 left-0 w-64 bg-white shadow-xl z-40 transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
    <div class="p-6 border-b border-gray-100">
      <a href="/dashboard" class="flex items-center">
        <img src="/app/assets/Logo_P1.png" alt="RanchSmart" class="h-14 w-auto object-contain">
      </a>
    </div>
    <nav class="mt-6 px-4">
      <ul class="space-y-1">
        <li>
          <a href="/dashboard" class="flex items-center space-x-3 px-4 py-3 text-gray-700 hover:bg-primary/10 rounded-xl transition-all duration-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="font-medium">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="/dashboard/animals" class="flex items-center space-x-3 px-4 py-3 text-gray-700 hover:bg-primary/10 rounded-xl transition-all duration-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="font-medium">Animaux</span>
          </a>
        </li>
        <li>
          <a href="/dashboard/enclos" class="flex items-center space-x-3 px-4 py-3 bg-gradient-to-r from-primary/10 to-accent/10 text-primary rounded-xl font-semibold shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2l9 4-9 4-9-4 9-4zm0 8l9 4-9 4-9-4 9-4zm0 8l9 4-9 4-9-4 9-4z"/>
            </svg>
            <span>Enclos</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- === FORMULAIRE ENCOLOS === -->
    <div class="mt-6 p-4">
      <h2 class="font-semibold text-gray-800 mb-2">Enclos créés</h2>
      <ul id="enclosList" class="space-y-2"></ul>
    </div>

    <div id="enclosFormContainer" class="mt-6 p-4 bg-white rounded-xl shadow-lg hidden animate-fade-in">
      <h2 class="text-lg font-semibold text-gray-800 mb-2">Créer un nouvel enclos</h2>
      <form id="enclosForm">
        <label class="block mb-2 text-gray-700">Nom de l'enclos</label>
        <input type="text" id="enclosName" class="w-full p-2 mb-3 border rounded-lg" required>
        <label class="block mb-2 text-gray-700">Type</label>
        <select id="enclosType" class="w-full p-2 mb-3 border rounded-lg">
          <option value="activité">Activité</option>
          <option value="blanc">Blanc</option>
          <option value="interdit">Interdit</option>
        </select>
        <button type="submit" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-accent transition-colors">Enregistrer</button>
      </form>
    </div>
  </aside>

  <!-- === MAIN CONTENT === -->
  <main class="lg:ml-64 p-6 min-h-screen animate-fade-in">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
      <div>
        <h1 class="text-4xl font-bold text-gray-800 bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">
          Gestion des Enclos
        </h1>
        <p class="text-muted mt-1 flex items-center gap-2">
          Visualisez, créez et modifiez vos enclos directement sur la carte interactive.
        </p>
      </div>
      <button onclick="refreshMap()" class="group bg-gradient-to-r from-primary to-accent text-white font-semibold px-6 py-3 rounded-xl shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300 flex items-center gap-3">
        <svg class="w-5 h-5 group-hover:rotate-180 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582a9.001 9.001 0 0117.418 0H20V4m0 16v-5h-.582a9.001 9.001 0 01-17.418 0H4v5"/>
        </svg>
        Actualiser la carte
      </button>
    </div>

    <!-- === MAP AREA === -->
    <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg border border-accent/20 overflow-hidden">
      <iframe id="mapFrame" src="/map" style="width:100%; height:100vh; border:none;"></iframe>
    </div>
  </main>

  <!-- === JS SECTION === -->
  <script src="/static/js/enclos.js"></script>

</body>
</html>
