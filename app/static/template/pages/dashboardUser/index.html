    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8B4513',
            accent: '#DAA520',
            dark: '#2F1B12',
            success: '#10B981',
            warning: '#F59E0B',
            danger: '#EF4444',

            sans: ['Inter', 'sans-serif'],

            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.4s ease-out',
            'pulse-soft': 'pulseSoft 2s infinite',
            'count-up': 'countUp 1.5s ease-out forwards',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
            pulseSoft: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0.8' } },
            countUp: { '0%': { transform: 'translateY(10px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } }
          }
        }
      }
    }
  </script>

<!-- ACTIVITÉ RÉCENTE AVEC GRAPHIQUE -->
<div class="bg-white/80 backdrop-blur-sm p-6 rounded-3xl shadow-lg border border-accent/20 mb-8">
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-xl font-bold text-gray-800">Activité Récente</h3>
    <select id="activityFilter" class="text-sm px-3 py-1 rounded-lg border border-accent/30 bg-white/70 focus:outline-none focus:ring-2 focus:ring-accent">
      <option value="7">7 derniers jours</option>
      <option value="30" selected>30 derniers jours</option>
      <option value="90">90 derniers jours</option>
    </select>
  </div>

  <div class="relative h-64">
    <canvas id="activityChart"></canvas>
  </div>

  <div class="mt-4 grid grid-cols-3 gap-3 text-center text-sm">
    <div class="bg-primary/5 rounded-xl p-3">
      <p class="font-bold text-primary" id="statAnimals">0</p>
      <p class="text-muted">Animaux ajoutés</p>
    </div>
    <div class="bg-accent/5 rounded-xl p-3">
      <p class="font-bold text-accent" id="statStaff">0</p>
      <p class="text-muted">Staff recruté</p>
    </div>
    <div class="bg-success/5 rounded-xl p-3">
      <p class="font-bold text-success" id="statVaccines">0</p>
      <p class="text-muted">Vaccins faits</p>
    </div>
  </div>

  </main>

  <script>
    const API_BASE_URL = 'http://127.0.0.1:8000';

    function updateClock() {
      const now = new Date();
      document.getElementById('currentDate').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('currentTime').textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchDashboardData() {
      try {
        const res = await fetch(`${API_BASE_URL}/animals/`);
        const animals = await res.json();

        const total = animals.length;
        const vaccinePending = animals.filter(a => !a.last_vaccination).length;
        const avgWeight = total ? (animals.reduce((s, a) => s + (a.weight || 0), 0) / total).toFixed(1) : 0;

        document.getElementById('totalAnimals').textContent = total;
        document.getElementById('vaccinePending').textContent = vaccinePending;
        document.getElementById('avgWeight').textContent = avgWeight + ' kg';
        document.getElementById('quickAnimals').textContent = total;

        document.getElementById('totalEnclosures').textContent = Math.floor(total / 3) || 0;
        document.getElementById('quickEnclosures').textContent = Math.floor(total / 3) || 0;
        document.getElementById('quickStaff').textContent = '5';

        const recent = animals.slice(0, 5);
        const container = document.getElementById('recentAnimals');
        container.innerHTML = recent.length ? recent.map(animal => `
          <div class="flex items-center justify-between p-4 bg-gray-50 rounded-2xl hover:bg-gray-100 transition">
            <div class="flex items-center gap-4">
              <img src="${animal.profile_image ? API_BASE_URL + animal.profile_image : 'https://placehold.co/60x60?text=' + animal.name[0]}" 
                   alt="${animal.name}" class="w-12 h-12 rounded-full object-cover shadow">
              <div>
                <p class="font-semibold text-gray-800">${animal.name}</p>
                <p class="text-xs text-muted">${animal.species} • Enclos #${animal.enclosure_id || '-'}</p>
              </div>
            </div>
            <span class="text-xs ${animal.health_status.includes('Bonne') ? 'text-success' : 'text-warning'} font-medium">
              ${animal.health_status}
            </span>
          </div>
        `).join('') : '<p class="text-center text-muted py-8">Aucun animal</p>';

      } catch (err) {
        document.getElementById('recentAnimals').innerHTML = '<p class="text-center text-danger py-8">Erreur de chargement</p>';
      }
    }

    document.querySelector('button').addEventListener('click', fetchDashboardData);

    window.addEventListener('load', () => {
      fetchDashboardData();
    });
  </script>

<script>
  let activityChart;

  async function fetchActivityData(days = 30) {
    try {
      const [animalsRes, staffRes, vaccinesRes] = await Promise.all([
        fetch(`${API_BASE_URL}/animals/`),
        fetch(`${API_BASE_URL}/staff/`),
        fetch(`${API_BASE_URL}/vaccines/`) // À créer si pas existant
      ]);

      const animals = await animalsRes.json();
      const staff = await staffRes.json();
      // const vaccines = await vaccinesRes.json(); // Décommente quand tu auras l'endpoint

      const now = new Date();
      const cutoff = new Date(now - days * 24 * 60 * 60 * 1000);

      // Génère les labels (dates)
      const labels = [];
      for (let i = 0; i < days; i++) {
        const date = new Date(now - i * 24 * 60 * 60 * 1000);
        labels.unshift(date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }));
      }

      // Compte par jour
      const animalCount = Array(days).fill(0);
      const staffCount = Array(days).fill(0);
      // const vaccineCount = Array(days).fill(0);

      animals.forEach(a => {
        const date = new Date(a.created_at || a.date_added);
        if (date >= cutoff) {
          const dayIndex = Math.floor((now - date) / (24 * 60 * 60 * 1000));
          if (dayIndex < days) animalCount[days - 1 - dayIndex]++;
        }
      });

      staff.forEach(s => {
        const date = new Date(s.created_at || s.date_joined);
        if (date >= cutoff) {
          const dayIndex = Math.floor((now - date) / (24 * 60 * 60 * 1000));
          if (dayIndex < days) staffCount[days - 1 - dayIndex]++;
        }
      });

      // Mise à jour stats
      document.getElementById('statAnimals').textContent = animalCount.reduce((a, b) => a + b, 0);
      document.getElementById('statStaff').textContent = staffCount.reduce((a, b) => a + b, 0);
      document.getElementById('statVaccines').textContent = '0'; // À connecter

      // Mise à jour graphique
      if (activityChart) activityChart.destroy();

      const ctx = document.getElementById('activityChart').getContext('2d');
      activityChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Animaux',
              data: animalCount,
              borderColor: '#8B4513',
              backgroundColor: 'rgba(139, 69, 19, 0.1)',
              tension: 0.4,
              fill: true,
              pointBackgroundColor: '#8B4513',
              pointRadius: 4,
            },
            {
              label: 'Staff',
              data: staffCount,
              borderColor: '#DAA520',
              backgroundColor: 'rgba(218, 165, 32, 0.1)',
              tension: 0.4,
              fill: true,
              pointBackgroundColor: '#DAA520',
              pointRadius: 4,
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              mode: 'index',
              intersect: false,
              backgroundColor: 'rgba(47, 27, 18, 0.9)',
              titleColor: '#fff',
              bodyColor: '#fff',
              cornerRadius: 8,
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#6B7280', font: { size: 11 } }
            },
            y: {
              beginAtZero: true,
              grid: { color: 'rgba(139, 69, 19, 0.1)' },
              ticks: { color: '#6B7280', stepSize: 1 }
            }
          },
          interaction: { mode: 'nearest', axis: 'x', intersect: false }
        }
      });

    } catch (err) {
      console.error("Erreur activité:", err);
    }
  }

  // Filtre
  document.getElementById('activityFilter').addEventListener('change', (e) => {
    fetchActivityData(parseInt(e.target.value));
  });

  // Chargement initial
  window.addEventListener('load', () => {
    fetchDashboardData();
    fetchActivityData(30); // 30 jours par défaut
  });
</script>
