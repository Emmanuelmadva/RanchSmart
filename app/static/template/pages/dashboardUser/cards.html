<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animaux | RanchSmart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8B4513',    
            accent: '#DAA520',     
            dark: '#2F1B12',
            success: '#10B981',
            warning: '#F59E0B',
            danger: '#EF4444',
            muted: '#6B7280',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.4s ease-out',
            'pulse-soft': 'pulseSoft 2s infinite',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
            pulseSoft: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0.8' } },
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f3f4f6; }
    ::-webkit-scrollbar-thumb { background: #DAA520; border-radius: 3px; }
  </style>
  <style>
  .skeleton {
    @apply bg-gray-200 rounded-lg animate-pulse;
  }
  .skeleton-text { @apply h-4 w-full skeleton; }
  .skeleton-text-short { @apply h-4 w-3/4 skeleton; }
  .skeleton-circle { @apply w-12 h-12 rounded-full skeleton; }
  .skeleton-image { @apply w-full h-48 rounded-xl skeleton; }
  .skeleton-button { @apply h-10 w-full rounded-lg skeleton; }

  .loader {
    @apply inline-block w-8 h-8 border-4 border-t-accent border-r-transparent border-b-transparent border-l-transparent rounded-full animate-spin;
  }
</style>
</head>
<body class="bg-gradient-to-br from-amber-50 to-orange-50 font-sans antialiased">

  <aside class="fixed inset-y-0 left-0 w-64 bg-white shadow-xl z-40 transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
    <div class="p-6 border-b border-gray-100">
      <a href="/dashboard" class="flex items-center space-x-3">
         <a href="#" class="flex items-center">
           <img src="/app/assets/Logo_P1.png" onerror="this.onerror=null;this.src='https://www.google.com/search?q=https://placehold.co/100x60/8B4513/FFFFFF%3Ftext%3DRanchSmart'" alt="RanchSmart" class="h-14 md:h-18 lg:h-20 w-auto max-h-full object-contain ">
      </a>
      </a>
    </div>
    <nav class="mt-6 px-4">
      <ul class="space-y-1">
        <li>
          <a href="/dashboard" class="flex items-center space-x-3 px-4 py-3 text-gray-700 hover:bg-primary/10 rounded-xl transition-all duration-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="font-medium">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="/dashboard/animals" class="flex items-center space-x-3 px-4 py-3 bg-gradient-to-r from-primary/10 to-accent/10 text-primary rounded-xl font-semibold shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
            <span>Animaux</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <main class="lg:ml-64 p-6 min-h-screen">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 animate-slide-up">
      <div>
        <h1 class="text-4xl font-bold text-gray-800 bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">
          Animaux du Ranch
        </h1>
        <p class="text-muted mt-1 flex items-center gap-2">
          <span id="animalCount">0</span> animaux enregistrés
          <span class="w-2 h-2 bg-accent rounded-full animate-pulse"></span>
        </p>
      </div>
      <button onclick="toggleModal()" class="group bg-gradient-to-r from-primary to-accent text-white font-semibold px-6 py-3 rounded-xl shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300 flex items-center gap-3">
        <svg class="w-5 h-5 group-hover:animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Nouvel Animal
      </button>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-white/80 backdrop-blur-sm p-4 rounded-xl shadow-sm border border-accent/20">
        <p class="text-xs text-muted">En bonne santé</p>
        <p id="healthyCount" class="text-2xl font-bold text-success">0</p>
      </div>
      <div class="bg-white/80 backdrop-blur-sm p-4 rounded-xl shadow-sm border border-accent/20">
        <p class="text-xs text-muted">À vacciner</p>
        <p id="vaccineDue" class="text-2xl font-bold text-warning">0</p>
      </div>
      <div class="bg-white/80 backdrop-blur-sm p-4 rounded-xl shadow-sm border border-accent/20">
        <p class="text-xs text-muted">Enclos pleins</p>
        <p id="fullEnclosures" class="text-2xl font-bold text-primary">0</p>
      </div>
      <div class="bg-white/80 backdrop-blur-sm p-4 rounded-xl shadow-sm border border-accent/20">
        <p class="text-xs text-muted">Poids moyen</p>
        <p id="avgWeight" class="text-2xl font-bold text-accent">0 kg</p>
      </div>
    </div>

    <div id="animalCardsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 auto-rows-fr">
      <div id="emptyState" class="col-span-full text-center py-20 animate-fade-in">
        <div class="mx-auto w-32 h-32 bg-accent/10 rounded-full flex items-center justify-center mb-4">
          <svg class="w-16 h-16 text-accent/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        </div>
        <p class="text-lg text-muted font-medium">Aucun animal pour le moment</p>
        <p class="text-sm text-muted/70">Commencez par en ajouter un !</p>
      </div>
    </div>
  </main>

  <div id="addAnimalModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 animate-fade-in">
    <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-screen overflow-y-auto animate-slide-up">
      <div class="sticky top-0 bg-white border-b border-gray-100 p-6 flex items-center justify-between">
        <h3 id="modalTitle" class="text-2xl font-bold bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">Nouvel Animal</h3>
        <button onclick="toggleModal()" class="w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <form id="addAnimalForm" onsubmit="event.preventDefault(); handleSubmit()" class="p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="relative">
            <input type="text" name="name" required placeholder=" " class="peer w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none transition">
            <label class="absolute left-4 -top-3 bg-white px-2 text-sm text-muted peer-focus:text-primary transition">Nom</label>
          </div>
          <div class="relative">
            <input type="text" name="species" required placeholder=" " class="peer w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none transition">
            <label class="absolute left-4 -top-3 bg-white px-2 text-sm text-muted peer-focus:text-primary transition">Espèce</label>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <input type="number" name="age" min="0" placeholder="Âge (ans)" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none">
          <input type="number" name="weight" step="0.1" min="0" placeholder="Poids (kg)" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none">
        </div>

        <div class="relative">
          <input type="text" name="health_status" value="Bonne santé" placeholder=" " class="peer w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none">
          <label class="absolute left-4 -top-3 bg-white px-2 text-sm text-muted peer-focus:text-primary transition">État de santé</label>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <input type="date" name="last_vaccination" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none">
          <input type="number" name="enclosure_id" min="1" placeholder="Enclos ID" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary focus:outline-none">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-3">Photo de l’animal</label>
          <div class="relative">
            <img id="photoPreview" src="" alt="Aperçu" class="w-full h-48 object-cover rounded-2xl mb-3 hidden shadow-md">
            <label class="flex flex-col items-center justify-center w-full h-40 border-3 border-dashed border-accent/40 rounded-2xl cursor-pointer bg-gradient-to-br from-accent/5 to-primary/5 hover:from-accent/10 hover:to-primary/10 transition-all duration-300">
              <svg class="w-10 h-10 text-accent mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
              <span id="uploadText" class="text-accent font-medium">Choisir une photo</span>
              <input id="file" name="file" type="file" accept="image/*" class="hidden">
            </label>
          </div>
        </div>

        <div id="messageBox" class="p-4 text-sm rounded-xl hidden animate-fade-in"></div>

        <div class="flex gap-4 pt-4 border-t border-gray-100">
          <button type="submit" class="flex-1 bg-gradient-to-r from-primary to-accent text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300">
            Enregistrer
          </button>
          <button type="button" onclick="toggleModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3.5 rounded-xl transition">
            Annuler
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="deleteModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 animate-fade-in">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 text-center animate-slide-up">
      <div class="w-20 h-20 mx-auto mb-6 bg-danger/10 rounded-full flex items-center justify-center">
        <svg class="w-12 h-12 text-danger animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      </div>
      <h3 class="text-2xl font-bold text-gray-800 mb-3">Confirmer la suppression</h3>
      <p class="text-muted mb-8">Cette action est <span class="text-danger font-bold">irréversible</span>. Êtes-vous sûr ?</p>
      <div class="flex gap-4">
        <button id="confirmDelete" class="flex-1 bg-danger hover:bg-red-600 text-white font-bold py-3 rounded-xl transition transform hover:scale-105">
          Supprimer
        </button>
        <button onclick="closeDeleteModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition">
          Annuler
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://127.0.0.1:8000';
    let editingAnimalId = null;
    let animalToDelete = null;

    function showMessage(msg, type = 'success') {
      const box = document.getElementById('messageBox');
      box.innerHTML = `
        <div class="flex items-center gap-2">
          ${type === 'error' ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>' : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>'}
          <span>${msg}</span>
        </div>`;
      box.className = `p-4 text-sm rounded-xl flex items-center gap-2 animate-fade-in ${type === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 4000);
    }

    function toggleModal() {
      const modal = document.getElementById('addAnimalModal');
      modal.classList.toggle('hidden');
      if (modal.classList.contains('hidden')) {
        document.getElementById('addAnimalForm').reset();
        document.getElementById('photoPreview').classList.add('hidden');
        document.getElementById('uploadText').textContent = 'Choisir une photo';
        editingAnimalId = null;
        document.getElementById('modalTitle').textContent = 'Nouvel Animal';
      }
    }

    function openEditModal(animal) {
      editingAnimalId = animal.id;
      const f = document.getElementById('addAnimalForm');
      f.name.value = animal.name;
      f.species.value = animal.species;
      f.age.value = animal.age || '';
      f.weight.value = animal.weight || '';
      f.health_status.value = animal.health_status;
      f.last_vaccination.value = animal.last_vaccination ? animal.last_vaccination.split('T')[0] : '';
      f.enclosure_id.value = animal.enclosure_id || '';

      const preview = document.getElementById('photoPreview');
      if (animal.profile_image) {
        preview.src = `${API_BASE_URL}${animal.profile_image}`;
        preview.classList.remove('hidden');
        document.getElementById('uploadText').textContent = 'Changer la photo';
      }
      document.getElementById('addAnimalModal').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = 'Modifier l’animal';
    }

    document.getElementById('file').addEventListener('change', e => {
      const file = e.target.files[0];
      const preview = document.getElementById('photoPreview');
      const text = document.getElementById('uploadText');
      if (file) {
        const reader = new FileReader();
        reader.onload = e => { 
          preview.src = e.target.result; 
          preview.classList.remove('hidden'); 
          text.textContent = file.name.length > 20 ? file.name.substring(0, 20) + '...' : file.name;
        };
        reader.readAsDataURL(file);
      } else {
        preview.classList.add('hidden');
        text.textContent = editingAnimalId ? 'Changer la photo' : 'Choisir une photo';
      }
    });

    function createAnimalCard(animal) {
      const img = animal.profile_image ? `${API_BASE_URL}${animal.profile_image}` : `https://placehold.co/600x400/9ca3af/ffffff?text=${encodeURIComponent(animal.name[0])}`;
      const healthColor = animal.health_status.includes('Bonne') ? 'bg-success/10 text-success' : 'bg-warning/10 text-warning';
      const vaccineStatus = animal.last_vaccination ? 'Vacciné' : 'À vacciner';
      const vaccineColor = animal.last_vaccination ? 'text-success' : 'text-warning';

      return `
        <div class="bg-white rounded-3xl shadow-lg overflow-hidden hover:shadow-2xl transform hover:-translate-y-2 transition-all duration-300 animate-slide-up group">
          <div class="relative h-56 overflow-hidden">
            <img src="${img}" alt="${animal.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" onerror="this.src='https://placehold.co/600x400?text=404';">
            <div class="absolute top-4 right-4 ${healthColor} px-3 py-1 rounded-full text-xs font-bold backdrop-blur-sm">
              ${animal.health_status}
            </div>
          </div>
          <div class="p-6">
            <h3 class="font-bold text-xl text-gray-800 truncate">${animal.name}</h3>
            <p class="text-sm text-muted mt-1">${animal.species}</p>
            
            <div class="grid grid-cols-2 gap-3 mt-4 text-sm">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>${animal.age ?? '-'} ans</span>
              </div>
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6h18M3 12h18M3 18h18"/></svg>
                <span>${animal.weight ?? '-'} kg</span>
              </div>
            </div>

            <div class="flex items-center justify-between mt-4 text-xs">
              <span class="flex items-center gap-1 ${vaccineColor}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                ${vaccineStatus}
              </span>
              <span class="text-muted">Enclos #${animal.enclosure_id ?? '-'}</span>
            </div>

            <div class="flex gap-3 mt-5">
              <button onclick='openEditModal(${JSON.stringify(animal)})' class="flex-1 bg-gradient-to-r from-primary/10 to-accent/10 text-primary font-bold text-sm py-2.5 rounded-xl hover:from-primary/20 hover:to-accent/20 transition">
                Modifier
              </button>
              <button onclick="openDeleteModal(${animal.id})" class="flex-1 bg-danger/10 text-danger font-bold text-sm py-2.5 rounded-xl hover:bg-danger/20 transition">
                Supprimer
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function updateStats(animals) {
      const healthy = animals.filter(a => a.health_status.includes('Bonne')).length;
      const vaccineDue = animals.filter(a => !a.last_vaccination).length;
      const avgWeight = animals.length ? (animals.reduce((s, a) => s + (a.weight || 0), 0) / animals.length).toFixed(1) : 0;

      document.getElementById('animalCount').textContent = animals.length;
      document.getElementById('healthyCount').textContent = healthy;
      document.getElementById('vaccineDue').textContent = vaccineDue;
      document.getElementById('avgWeight').textContent = avgWeight;
    }

    async function fetchAnimals() {
      const container = document.getElementById('animalCardsContainer');
      const empty = document.getElementById('emptyState');
      showLoader('animalCardsContainer', 'cards');
      empty.classList.add('hidden');
      try {
        const res = await fetch(`${API_BASE_URL}/animals/`);
        const animals = await res.json();
        container.innerHTML = animals.length ? animals.map(createAnimalCard).join('') : '';
        empty.classList.toggle('hidden', animals.length > 0);
        updateStats(animals);
      } catch (err) {
        container.innerHTML = `<p class="col-span-full text-danger text-center py-10">Erreur de chargement</p>`;
      }
    }

    async function handleSubmit() {
      const form = document.getElementById('addAnimalForm');
      const data = new FormData(form);
      ['age', 'weight', 'last_vaccination', 'enclosure_id'].forEach(f => !data.get(f) && data.delete(f));

      const url = editingAnimalId ? `${API_BASE_URL}/animals/${editingAnimalId}` : `${API_BASE_URL}/animals/`;
      const method = editingAnimalId ? 'PUT' : 'POST';
      showLoader(modal, 'modal');
      try {
        const res = await fetch(url, { method, body: data });
        if (!res.ok) throw new Error((await res.json()).detail || "Erreur");
        showMessage(editingAnimalId ? "Mis à jour avec succès !" : "Animal ajouté !");
        toggleModal();
        fetchAnimals();
      } catch (err) {
        showMessage(err.message, 'error');
      }
    }

    function openDeleteModal(id) {
      animalToDelete = id;
      document.getElementById('deleteModal').classList.remove('hidden');
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.add('hidden');
      animalToDelete = null;
    }

    document.getElementById('confirmDelete').onclick = async () => {
      if (!animalToDelete) return;
      try {
        await fetch(`${API_BASE_URL}/animals/${animalToDelete}`, { method: 'DELETE' });
        showMessage("Animal supprimé", 'success');
        closeDeleteModal();
        fetchAnimals();
      } catch (err) {
        showMessage("Échec de suppression", 'error');
      }
    };

    window.addEventListener('load', fetchAnimals);
  </script>

  <script>
  function showLoader(containerId, type = 'cards') {
    const container = document.getElementById(containerId);
    if (!container) return;

    let loaderHTML = '';

    if (type === 'cards') {
      loaderHTML = Array(6).fill().map(() => `
        <div class="bg-white rounded-3xl shadow-lg p-6 animate-pulse">
          <div class="skeleton-image mb-4"></div>
          <div class="space-y-3">
            <div class="skeleton-text"></div>
            <div class="skeleton-text-short"></div>
            <div class="flex gap-2">
              <div class="skeleton-button flex-1"></div>
              <div class="skeleton-button flex-1"></div>
            </div>
          </div>
        </div>
      `).join('');
    }

    else if (type === 'stats') {
      loaderHTML = Array(4).fill().map(() => `
        <div class="bg-white/80 backdrop-blur-sm p-6 rounded-3xl shadow-lg border border-accent/20">
          <div class="flex items-center justify-between mb-3">
            <div class="skeleton-circle"></div>
            <div class="skeleton-text-short"></div>
          </div>
          <div class="h-10 skeleton rounded-lg"></div>
          <div class="h-4 skeleton mt-2 w-16"></div>
        </div>
      `).join('');
    }

    else if (type === 'modal') {
      const form = container.querySelector('form');
      const loadingDiv = container.querySelector('#modalLoading') || document.createElement('div');
      loadingDiv.id = 'modalLoading';
      loadingDiv.innerHTML = `
        <div class="flex flex-col items-center justify-center py-8 space-y-4">
          <div class="loader"></div>
          <p class="text-sm text-muted">Traitement en cours...</p>
        </div>
      `;
      loadingDiv.className = 'space-y-4';
      form.classList.add('hidden');
      container.appendChild(loadingDiv);
      return;
    }

    container.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">${loaderHTML}</div>`;
  }

  function hideLoader(containerId, type = 'cards') {
    const loadingDiv = document.getElementById('modalLoading');
    if (loadingDiv) {
      loadingDiv.remove();
      document.querySelector('#addAnimalForm')?.classList.remove('hidden');
    }
  }
</script>
</body>
</html>
